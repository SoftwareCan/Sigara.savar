<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <!-- ══ Güvenlik Başlıkları ══════════════════════════════════════════════════ -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' https://www.gstatic.com https://www.google.com https://www.recaptcha.net;
    style-src 'self';
    img-src 'self' data: blob: https://*.googleusercontent.com https://lh3.googleusercontent.com;
    connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://firebaseinstallations.googleapis.com https://www.google.com https://www.gstatic.com https://www.recaptcha.net;
    frame-src https://sigara-savar.firebaseapp.com https://www.google.com https://accounts.google.com https://appleid.apple.com https://www.recaptcha.net;
    object-src 'none';
    base-uri 'self';
    form-action 'self';
    upgrade-insecure-requests;
  ">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sigara Savar hesabınıza giriş yapın veya yeni hesap oluşturun.">
  <title>Giriş Yap — Sigara Savar</title>
  <meta name="theme-color" content="#1FA86D">
  <link rel="icon" type="image/png" href="assets/app-icon.png">
  <link rel="apple-touch-icon" href="assets/app-icon.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="auth.css">
</head>

<body class="auth-page">

  <header class="site-header">
    <a class="brand" href="index.html" aria-label="Sigara Savar ana sayfa">
      <img src="assets/app-icon.png" class="brand-icon" alt="Sigara Savar">
      <span class="brand-name">Sigara Savar</span>
    </a>
  </header>

  <main class="auth-main">
    <div class="auth-card" id="auth-card">

      <!-- Logo & Başlık -->
      <div class="auth-header">
        <img src="assets/app-icon.png" alt="Sigara Savar" class="auth-logo">
        <h1>Hesabına Giriş Yap</h1>
        <p class="auth-subtitle">Yolculuğuna kaldığın yerden devam et.</p>
      </div>

      <!-- Sosyal Giriş Butonları -->
      <div class="auth-socials">
        <button class="social-btn google-btn" id="btn-google" type="button">
          <svg width="20" height="20" viewBox="0 0 48 48" fill="none">
            <path d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 7.9 3l5.7-5.7C34.5 6.5 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.3-.4-3.5z" fill="#FFC107"/>
            <path d="M6.3 14.7l6.6 4.8C14.7 16 19 12 24 12c3.1 0 5.8 1.1 7.9 3l5.7-5.7C34.5 6.5 29.5 4 24 4 16.3 4 9.7 8.3 6.3 14.7z" fill="#FF3D00"/>
            <path d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.3 35.1 26.8 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.6 39.6 16.3 44 24 44z" fill="#4CAF50"/>
            <path d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.3 5.6l6.2 5.2C37 38.3 44 33 44 24c0-1.2-.1-2.3-.4-3.5z" fill="#1976D2"/>
          </svg>
          <span>Google ile Giriş Yap</span>
          <div class="btn-spinner" hidden></div>
        </button>

        <button class="social-btn apple-btn" id="btn-apple" type="button">
          <svg width="20" height="20" viewBox="0 0 814 1000" fill="currentColor">
            <path d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.3-164-39.3c-76 0-103.7 40.8-165.9 40.8s-105.3-57.8-155.5-127.4C46 790.7 0 663 0 541.8c0-207.5 135.4-317.1 268.5-317.1 99.8 0 182.6 65.8 244.9 65.8 60.4 0 154.9-69.1 269.4-69.1 43.4 0 160.6 4 248.2 108.9zm-325.3-90.8c-10.4-54.8 7.4-112.7 45.2-150.6 37.8-37.9 91.6-67.4 144.6-67.4 5.8 55.4-15.8 113.3-53.6 153.4-36.2 38.3-89 68.8-136.2 64.6z"/>
          </svg>
          <span>Apple ile Giriş Yap</span>
          <div class="btn-spinner" hidden></div>
        </button>
      </div>

      <!-- Ayraç -->
      <div class="auth-divider">
        <span>veya e-posta ile devam et</span>
      </div>

      <!-- Tab Seçici -->
      <div class="auth-tabs" role="tablist">
        <button class="auth-tab active" id="tab-login" role="tab" aria-selected="true" aria-controls="panel-login">Giriş Yap</button>
        <button class="auth-tab" id="tab-register" role="tab" aria-selected="false" aria-controls="panel-register">Kayıt Ol</button>
      </div>

      <!-- Hata/Başarı Mesajı -->
      <div class="auth-message" id="auth-message" role="alert" aria-live="polite" hidden></div>

      <!-- Giriş Formu -->
      <form class="auth-form active" id="panel-login" role="tabpanel" aria-labelledby="tab-login" novalidate>
        <div class="field-group">
          <label for="login-email">E-posta</label>
          <input type="email" id="login-email" name="email" placeholder="ornek@mail.com" autocomplete="email" required>
        </div>
        <div class="field-group">
          <label for="login-password">
            <span>Şifre</span>
            <button type="button" class="forgot-link" id="btn-forgot">Şifremi unuttum</button>
          </label>
          <div class="input-wrap">
            <input type="password" id="login-password" name="password" placeholder="••••••••" autocomplete="current-password" required>
            <button type="button" class="toggle-pw" aria-label="Şifreyi göster/gizle" data-target="login-password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="auth-submit" id="btn-login">
          <span>Giriş Yap</span>
          <div class="btn-spinner" hidden></div>
        </button>
      </form>

      <!-- Kayıt Formu -->
      <form class="auth-form" id="panel-register" role="tabpanel" aria-labelledby="tab-register" novalidate hidden>
        <div class="field-group">
          <label for="reg-name">Ad Soyad</label>
          <input type="text" id="reg-name" name="name" placeholder="Adınız" autocomplete="name" required>
        </div>
        <div class="field-group">
          <label for="reg-email">E-posta</label>
          <input type="email" id="reg-email" name="email" placeholder="ornek@mail.com" autocomplete="email" required>
        </div>
        <div class="field-group">
          <label for="reg-password">Şifre</label>
          <div class="input-wrap">
            <input type="password" id="reg-password" name="password" placeholder="En az 6 karakter" autocomplete="new-password" required minlength="6">
            <button type="button" class="toggle-pw" aria-label="Şifreyi göster/gizle" data-target="reg-password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="auth-submit" id="btn-register">
          <span>Hesap Oluştur</span>
          <div class="btn-spinner" hidden></div>
        </button>
      </form>

      <!-- Şifre Sıfırlama Formu -->
      <form class="auth-form" id="panel-forgot" novalidate hidden>
        <p class="forgot-info">E-posta adresinizi girin, şifre sıfırlama bağlantısı gönderelim.</p>
        <div class="field-group">
          <label for="forgot-email">E-posta</label>
          <input type="email" id="forgot-email" name="email" placeholder="ornek@mail.com" autocomplete="email" required>
        </div>
        <button type="submit" class="auth-submit" id="btn-reset">
          <span>Bağlantı Gönder</span>
          <div class="btn-spinner" hidden></div>
        </button>
        <button type="button" class="back-link" id="btn-back-login">← Giriş Yap'a dön</button>
      </form>

    </div>
  </main>

  <script type="module" src="auth.js"></script>
</body>

</html>
